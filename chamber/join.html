        content="Join the Kampala Chamber of Commerce and connect with businesses, networking opportunities, and membership benefits across Uganda.">

<body>

    <header>
        <h1>Join Kampala Chamber</h1>
        <nav id="navMenu">

    <main>

        <form action="#" method="post">

            <label>Full Name
                <input type="text" required>
            </label>

            <label>Email
                <input type="email" required>
            </label>

            <label>Phone
                <input type="tel">
            </label>

            <label>Business Name
                <input type="text">
            </label>

            <label>Membership Level
                <select>
                    <option>NP Membership</option>
                    <option>Bronze</option>
                    <option>Silver</option>
                    <option>Gold</option>
                </select>
            </label>

            <label>Business Description
                <textarea></textarea>
            </label>

            <button type="submit">Submit Application</button>

        </form>

    </main>
