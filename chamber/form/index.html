<body>

<header>
  
 <button id="menuBtn" aria-label="Open Menu">☰</button>

      <li><a href="form/thankyou.html">Thank You</a></li>
     
    </ul>
  </nav>
</header>

<main>
  <h1>Join Kampala Chamber</h1>

<form method="get" action="thankyou.html">

  <label>
    First Name
    <input type="text" name="firstname" title="Enter your first name" required  autocomplete="given-name"/>
  </label>

  <label>
    Last Name
    <input type="text" name="lastname" title="Enter your last name" required  autocomplete="family-name"/>
 </label>
   
 <label> 
    Given Name
    <input type="text" name="givenname" title="Enter your given name" required  autocomplete="given-name"/>
 </label>

  <label>
    Business Title
    <input type="text" name="title" required minlength="7"
      pattern="[A-Za-z\\-\\s]{7,}"
      title="At least 7 characters, letters, hyphens, spaces"
      autocomplete="organization-title" />
  </label>

    <label>
      business Description
      <input type="text" name="description" title="Enter a description of your business" required  autocomplete="organization-description" minlength="10"/>
    </label>
  

  <label>
    Email
    <input type="email" name="email" required
      placeholder="example@email.com"
      autocomplete="email" />
  </label>

  <label>
    Phone
    <input type="tel" name="phone" required autocomplete="tel" />
  </label>

  <label>
    Organization Name
    <input type="text" name="organization" required autocomplete="organization" />
  </label>

  <label>
    Membership Level
    <select name="membership" required>
      <option value="np">NP Membership</option>
      <option value="bronze">Bronze</option>
      <option value="silver">Silver</option>
      <option value="gold">Gold</option>
    </select>
  </label>

  <label>
    Business Description
    <textarea name="description" title="Enter a description of your business" required minlength="10" autocomplete="organization-description"></textarea>
  </label>

  <!-- Timestamp -->
  <input type="hidden" id="timestamp" name="timestamp" />

  <button type="submit">Submit Application</button>

</form>

</main>

<footer>
        <p>&copy; <span id="year"></span> Kampala Chamber | Byakagaba Wycliff 🌍🌍 | WDD 231</p>
        <p id="lastModified"></p>
    </footer>
